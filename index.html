                <tr><td class="py-2.5 px-3 font-medium">Kích Hoạt Playbook Price War</td><td class="text-center text-emerald-400 font-bold">Toàn quyền</td><td class="text-center text-emerald-400 font-bold">Toàn quyền</td><td class="text-center text-slate-500">Không</td><td class="text-center text-blue-400">Xem</td></tr>
                <tr><td class="py-2.5 px-3 font-medium">Phê Duyệt Nhập Hàng SP Mới (PO)</td><td class="text-center text-emerald-400 font-bold">Toàn quyền</td><td class="text-center text-blue-400">Thẩm định POS</td><td class="text-center text-emerald-400 font-bold">Tạo PO</td><td class="text-center text-slate-500">Không</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 3. TAB SWITCHING & ROUTING
    // ==========================================
    function switchTab(tabId) {
      currentTab = tabId;
      const main = document.getElementById('mainContentArea');
      
      // Update Active Navigation Highlight
      document.querySelectorAll('.nav-item').forEach(btn => {
        if (btn.getAttribute('data-tab') === tabId) {
          btn.classList.add('active-nav-tab');
        } else {
          btn.classList.remove('active-nav-tab');
        }
      });

      // Render View
      switch(tabId) {
        case 'ceo-dashboard': main.innerHTML = renderCeoDashboard(); break;
        case 'product-master': main.innerHTML = renderProductMaster(); break;
        case 'competitors': main.innerHTML = renderCompetitors(); break;
        case 'pricing-intelligence': main.innerHTML = renderPricingIntelligence(); break;
        case 'what-if-simulator': main.innerHTML = renderWhatIfSimulator(); break;
        case 'ai-advisor': main.innerHTML = renderAiAdvisor(); break;
        case 'price-war': main.innerHTML = renderPriceWarDetector(); break;
        case 'compare-matrix': main.innerHTML = renderCompareMatrix(); break;
        case 'product-mapping': main.innerHTML = renderCompareMatrix(); break;
        case 'market-gap': main.innerHTML = renderMarketGap(); break;
        case 'new-product-pos': main.innerHTML = renderNewProductPos(); break;
        case 'inventory-intelligence': main.innerHTML = renderInventoryIntelligence(); break;
        case 'alert-center': main.innerHTML = renderAlertCenter(); break;
        case 'settings': main.innerHTML = renderSettings(); break;
        case 'user-permissions': main.innerHTML = renderUserPermissions(); break;
        default: main.innerHTML = renderCeoDashboard(); break;
      }

      // Re-initialize Lucide Icons after dynamic HTML injection
      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ==========================================
    // 4. INTERACTIVE HANDLERS & MODALS
    // ==========================================
    function openProductDetail(productId) {
      const p = PRODUCTS.find(item => item.id === productId);
      if (!p) return;

      document.getElementById('modalSkuBadge').innerText = p.sku;
      document.getElementById('modalProductName').innerText = p.name;

      const body = document.getElementById('modalBodyContent');
      body.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="space-y-3">
            <img src="${p.image}" class="w-full h-48 rounded-xl object-cover border border-slate-700" />
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
              <div><span class="text-slate-400">Danh mục:</span> <span class="text-white font-medium">${p.category}</span></div>
              <div><span class="text-slate-400">Bảo hành:</span> <span class="text-emerald-400 font-bold">${p.warranty}</span></div>
              <div><span class="text-slate-400">Tồn kho:</span> <span class="text-white font-mono">${p.inventory} cái (${p.stockCoverageMonths} tháng)</span></div>
            </div>
          </div>

          <div class="md:col-span-2 space-y-4">
            <!-- 6-Tier Ladder -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
              <h4 class="text-xs font-bold text-rose-400 uppercase tracking-wider">Thang Giá 6 Tầng Chuẩn</h4>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs font-mono">
                <div class="bg-slate-900 p-2 rounded border border-slate-800"><span class="text-slate-400 text-[10px] block">1. Giá Sàn (Floor)</span><strong class="text-rose-400">${formatVND(p.floorPrice)}</strong></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-800"><span class="text-slate-400 text-[10px] block">2. Giá Tấn Công (Attack)</span><strong class="text-amber-400">${formatVND(p.attackPrice)}</strong></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-800"><span class="text-slate-400 text-[10px] block">3. Giá Cạnh Tranh</span><strong class="text-blue-400">${formatVND(p.competitivePrice)}</strong></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-800"><span class="text-slate-400 text-[10px] block">4. Giá Mục Tiêu (Target)</span><strong class="text-emerald-400">${formatVND(p.targetPrice)}</strong></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-800"><span class="text-slate-400 text-[10px] block">5. Giá Premium</span><strong class="text-purple-400">${formatVND(p.premiumPrice)}</strong></div>
                <div class="bg-slate-900 p-2 rounded border border-slate-800"><span class="text-slate-400 text-[10px] block">6. Giá Niêm Yết</span><strong class="text-slate-400 line-through">${formatVND(p.listPrice)}</strong></div>
              </div>
            </div>

            <!-- AI Insight -->
            <div class="p-3 bg-purple-500/10 border border-purple-500/30 rounded-xl text-xs text-purple-200">
              <div class="font-bold mb-1 flex items-center space-x-1.5"><i data-lucide="sparkles" class="w-4 h-4 text-purple-400"></i><span>Khuyến nghị từ AI Pricing Advisor:</span></div>
              <p>${p.aiRecommendation.details}</p>
            </div>
          </div>
        </div>
      `;

      document.getElementById('productDetailModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeProductModal() {
      document.getElementById('productDetailModal').classList.add('hidden');
    }

    function toggleMobileMenu() {
      const drawer = document.getElementById('mobileDrawer');
      const backdrop = document.getElementById('mobileDrawerBackdrop');
      if (drawer.classList.contains('-translate-x-full')) {
        drawer.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        drawer.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'bg-slate-900 border border-emerald-500/40 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center space-x-2 animate-in slide-in-from-bottom duration-200 pointer-events-auto';
      toast.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-emerald-400 shrink-0"></i><span>${message}</span>`;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.remove();
      }, 3500);
    }

    function approveExecutiveAction(sku, actionName) {
      showToast(`Đã phê duyệt thành công: "${actionName}" cho SKU ${sku}`);
    }

    function handleGlobalSearch(val) {
      searchKeyword = val;
      if (currentTab !== 'product-master') {
        switchTab('product-master');
      } else {
        document.getElementById('mainContentArea').innerHTML = renderProductMaster();
        lucide.createIcons();
      }
    }

    function handleLocalSearch(val) {
      searchKeyword = val;
      document.getElementById('mainContentArea').innerHTML = renderProductMaster();
      lucide.createIcons();
    }

    function changeUserRole(role) {
      currentRole = role;
      showToast(`Đã chuyển sang chế độ phân quyền: ${role}`);
    }

    function updateSimValue(key, val) {
      simValues[key] = parseFloat(val);
      
      const grossProfit = simValues.price - simValues.trueCost;
      const grossMarginPct = (grossProfit / simValues.price);
      const totalRevenue = simValues.price * simValues.volume;
      const totalGrossProfit = grossProfit * simValues.volume;
      const mktCost = totalRevenue * (simValues.mktPercent / 100);
      const feeCost = totalRevenue * (simValues.feePercent / 100);
      const netProfit = totalGrossProfit - mktCost - feeCost;

      if(document.getElementById('simPriceVal')) document.getElementById('simPriceVal').innerText = formatVND(simValues.price);
      if(document.getElementById('simVolumeVal')) document.getElementById('simVolumeVal').innerText = `${simValues.volume} cái`;
      if(document.getElementById('simMktVal')) document.getElementById('simMktVal').innerText = `${simValues.mktPercent}%`;
      if(document.getElementById('simFeeVal')) document.getElementById('simFeeVal').innerText = `${simValues.feePercent}%`;

      if(document.getElementById('simTotalRevenue')) document.getElementById('simTotalRevenue').innerText = formatVND(totalRevenue);
      if(document.getElementById('simGrossProfit')) document.getElementById('simGrossProfit').innerText = formatVND(totalGrossProfit);
      if(document.getElementById('simGrossMargin')) document.getElementById('simGrossMargin').innerText = `Biên gộp: ${formatPercent(grossMarginPct)}`;
      if(document.getElementById('simNetProfit')) document.getElementById('simNetProfit').innerText = formatVND(netProfit);
      if(document.getElementById('simNetMargin')) document.getElementById('simNetMargin').innerText = `Biên ròng: ${formatPercent(netProfit / totalRevenue)}`;
    }

    function resetSimulator() {
      simValues = { price: 1290000, basePrice: 1290000, trueCost: 810000, volume: 660, mktPercent: 12, feePercent: 9 };
      document.getElementById('mainContentArea').innerHTML = renderWhatIfSimulator();
      lucide.createIcons();
      showToast('Đã khôi phục các biến số giả lập!');
    }

    function loadSimSku(productId) {
      const p = PRODUCTS.find(item => item.id === productId);
      if (p) {
        simValues.price = p.sellingPrice;
        simValues.basePrice = p.sellingPrice;
        simValues.trueCost = p.trueCost;
        simValues.volume = p.avgMonthlySales;
        document.getElementById('mainContentArea').innerHTML = renderWhatIfSimulator();
        lucide.createIcons();
      }
    }

    function askAiQuestion(question) {
      const input = document.getElementById('aiChatInput');
      if (input) {
        input.value = question;
        sendAiMessage();
      }
    }

    function sendAiMessage() {
      const input = document.getElementById('aiChatInput');
      const text = input.value.trim();
      if (!text) return;

      const chatOutput = document.getElementById('aiChatOutput');
      
      // User message
      const userBubble = document.createElement('div');
      userBubble.className = 'flex items-start justify-end space-x-2 text-xs';
      userBubble.innerHTML = `
        <div class="bg-rose-600 text-white rounded-2xl px-4 py-2.5 max-w-lg shadow-lg">
          ${text}
        </div>
      `;
      chatOutput.appendChild(userBubble);
      input.value = '';

      // AI Response
      setTimeout(() => {
        const aiBubble = document.createElement('div');
        aiBubble.className = 'flex items-start space-x-3 text-xs';
        aiBubble.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-white shrink-0">
            <i data-lucide="bot" class="w-4 h-4"></i>
          </div>
          <div class="flex-1 bg-slate-900 border border-purple-500/30 rounded-2xl p-4 space-y-2 text-slate-200">
            <div class="flex justify-between items-center"><strong class="text-purple-300 font-bold">Lock&King AI Analysis</strong><span class="text-slate-500 text-[10px]">Vừa xong</span></div>
            <p>Dựa trên ma trận 9 thuộc tính kỹ thuật và chi phí True Cost, phản hồi cho câu hỏi <em>"${text}"</em>:</p>
            <div class="p-2.5 bg-slate-950 rounded-lg text-slate-300 border border-slate-800 space-y-1">
              <div>🎯 <strong>Khuyến nghị:</strong> Giữ nguyên giá sàn và chạy chiến dịch quà tặng Bundle trị giá 50.000 đ.</div>
              <div>📈 <strong>Dự báo:</strong> Giúp duy trì biên lợi nhuận ròng trên 18% và không kích hoạt vòng xoáy giảm giá với đối thủ.</div>
            </div>
          </div>
        `;
        chatOutput.appendChild(aiBubble);
        lucide.createIcons();
      }, 500);
    }

    function exportDataExcel() {
      showToast('Đang xuất file Excel dữ liệu định giá Lock&King...');
    }

    // ==========================================
    // 5. INITIALIZATION
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      switchTab('ceo-dashboard');
    });
  </script>
</body>
